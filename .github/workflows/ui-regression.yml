name: JuJuBit UI Regression

on:
  schedule:
    # GitHub cron uses UTC: 02:30/10:30 = China Standard Time 10:30/18:30.
    - cron: '30 2 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jujubit-production-ui-regression
  cancel-in-progress: false

jobs:
  ui-regression:
    # The storefront rate-limits GitHub-hosted data-center IPs. Use a trusted
    # macOS runner registered to this repository instead.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      BASE_URL: https://jujubit.ai
      TEST_IMAGE_SOLO: assets/two-dogs.jpeg
      TEST_IMAGE_DUO: assets/two-dogs.jpeg
      TEST_IMAGE_LARGE: assets/two-dogs.jpeg
      SCHEDULED_TEST_MODE: all
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_RECEIVE_ID_TYPE: email
      FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Resolve video converter
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::error::ffmpeg is required on the self-hosted runner (brew install ffmpeg)."
            exit 1
          fi
          echo "$(dirname "$(command -v ffmpeg)")" >> "$GITHUB_PATH"
          echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Validate Feishu configuration
        run: |
          test -n "$FEISHU_APP_ID" || { echo "Missing FEISHU_APP_ID"; exit 1; }
          test -n "$FEISHU_APP_SECRET" || { echo "Missing FEISHU_APP_SECRET"; exit 1; }
          test -n "$FEISHU_RECEIVE_ID" || { echo "Missing FEISHU_RECEIVE_ID"; exit 1; }

      - name: Run all UI cases and notify Feishu
        run: npm run test:scheduled

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            generation-elements.json
            cart-elements.json
            checkout-elements.json
          if-no-files-found: warn
          retention-days: 14
