name: Scheduled UI regression

on:
  schedule:
    # GitHub Actions uses UTC. Offset from the top of the hour to reduce load-related delay.
    - cron: '17 3 * * 1-5'   # 11:17 Asia/Shanghai
    - cron: '47 10 * * 1-5'  # 18:47 Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run scope. daily runs TC-01~TC-05; experiment runs a selected experiment.'
        required: true
        default: daily
        type: choice
        options:
          - daily
          - safe
          - all
          - experiment
      experiment:
        description: 'Experiment key used when mode=experiment.'
        required: false
        default: membership
        type: string
      chat_id:
        description: 'Feishu chat ID for command-triggered result notification.'
        required: false
        default: ''
        type: string
      event_id:
        description: 'Feishu event ID used to suppress delivery retries.'
        required: false
        default: ''
        type: string
      simulate_failure_record:
        description: 'Verification only: create a clearly marked Feishu failure-record document.'
        required: true
        default: false
        type: boolean

# Do not allow two production guest sessions to generate concurrently.
concurrency:
  group: ui-regression-production
  cancel-in-progress: false

jobs:
  regression:
    name: Chromium UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Scheduled runs are hard-locked to TC-01~TC-05 even if dispatch
      # defaults or manual inputs change later.
      SCHEDULED_TEST_MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode || 'daily' }}
      EXPERIMENT_KEY: ${{ inputs.experiment || '' }}
      BASE_URL: https://jujubit.ai
      PRODUCT_URL: ${{ vars.PRODUCT_URL }}
      TEST_IMAGE_SOLO: assets/two-dogs.jpeg
      TEST_IMAGE_DUO: assets/two-dogs.jpeg
      TEST_IMAGE_LARGE: assets/two-dogs.jpeg
      TEST_PROMPT: 生成2个小狗
      TEST_MEMBERSHIP_STABLE_ID: ${{ vars.TEST_MEMBERSHIP_STABLE_ID || 'jujubit-ui-e2e-membership-20260902' }}
      TEST_MEMBERSHIP_CONTROL_STABLE_ID: ${{ vars.TEST_MEMBERSHIP_CONTROL_STABLE_ID }}
      TEST_STATSIG_CLIENT_KEY: ${{ vars.TEST_STATSIG_CLIENT_KEY || 'client-2tnhqG57crRsKHR9oTHbP4UsCNu7zQjghyI8otQUMU4' }}
      SCHEDULED_TRACKING_ENABLED: 'false'
      TRACKING_TEST_ENABLED: 'false'
      TRACKING_FAULT_INJECTION_ENABLED: 'false'

      # The application bot posts its result card to the configured Feishu group.
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_RECEIVE_ID_TYPE: chat_id
      FEISHU_RECEIVE_ID: ${{ inputs.chat_id || secrets.FEISHU_GROUP_CHAT_ID }}
      FEISHU_WEBHOOK_URL: ''
      FEISHU_WEBHOOK_SECRET: ''

      # Failure docs are created in this Wiki node through the application bot.
      FEISHU_EXECUTION_RECORDS_PARENT: ${{ secrets.FEISHU_EXECUTION_RECORDS_PARENT }}
      FEISHU_SOLUTION_LIBRARY_ROOT: ''
      # Manual verification only. This is false for regular dispatched runs.
      FEISHU_FAILURE_RECORD_VALIDATION: ${{ inputs.simulate_failure_record || 'false' }}

    steps:
      - name: Ignore duplicate Feishu delivery
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_EVENT_ID: ${{ inputs.event_id || '' }}
        run: |
          SAFE_EVENT_ID="$(printf '%s' "$FEISHU_EVENT_ID" | tr -cd 'A-Za-z0-9_-')"
          echo "safe_event_id=$SAFE_EVENT_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$SAFE_EVENT_ID" ]; then
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=feishu-event-$SAFE_EVENT_ID&per_page=1" --jq '.total_count')"
          if [ "$COUNT" -gt 0 ]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "Duplicate Feishu event ignored: $SAFE_EVENT_ID"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.dedupe.outputs.duplicate != 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.dedupe.outputs.duplicate != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.dedupe.outputs.duplicate != 'true'
        run: npm ci

      - name: Install Chromium and Linux dependencies
        if: steps.dedupe.outputs.duplicate != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run dispatched regression and notify Feishu
        if: steps.dedupe.outputs.duplicate != 'true'
        run: npm run test:scheduled

      - name: Upload Playwright report and failure evidence
        if: always() && steps.dedupe.outputs.duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Record processed Feishu event
        if: always() && steps.dedupe.outputs.safe_event_id != '' && steps.dedupe.outputs.duplicate != 'true'
        env:
          FEISHU_EVENT_ID: ${{ steps.dedupe.outputs.safe_event_id }}
        run: |
          SAFE_EVENT_ID="$(printf '%s' "$FEISHU_EVENT_ID" | tr -cd 'A-Za-z0-9_-')"
          mkdir -p .feishu-event-marker
          printf '%s\n' "$SAFE_EVENT_ID" > .feishu-event-marker/event-id.txt

      - name: Upload Feishu event marker
        if: always() && steps.dedupe.outputs.safe_event_id != '' && steps.dedupe.outputs.duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feishu-event-${{ steps.dedupe.outputs.safe_event_id }}
          path: .feishu-event-marker/event-id.txt
          retention-days: 14
